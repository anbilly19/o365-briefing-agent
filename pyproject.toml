[project]
name = "o365-briefing-agent"
version = "0.1.0"
description = "Preemptive daily briefing agent powered by LangGraph + local LLM + Microsoft Graph API"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Anosh Bilimoria", email = "anoshbilimoria@gmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    # LangGraph / LangChain (Phase 2+ dashboard)
    "langgraph>=0.4",
    "langchain-core>=0.3",

    # HTTP
    "httpx>=0.28.0",

    # Microsoft Graph auth
    "msal>=1.35.0",

    # O365 high-level connector (Phase 1 delta queries)
    "O365>=2.1.9",

    # Data validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # Config / env
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",

    # Email cleaning
    "html2text>=2024.2.26",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.1",

    # LLM output repair
    "json-repair>=0.59.10",

    # Pretty console output
    "rich>=15.0.0",

    # SQLite async (memory module)
    "aiosqlite>=0.20.0",

    # OAuth token storage (optional but recommended)
    "keyring>=25.0.0",

    # Scheduling helper (optional)
    "croniter>=6.2.2",

    # Web server (Phase 2 dashboard)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
briefing-agent = "briefing_agent.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/briefing_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/briefing_agent --cov-report=term-missing"
