[project]
name = "o365-briefing-agent"
version = "0.1.0"
description = "Preemptive daily briefing agent powered by LangGraph + local LLM + Microsoft Graph API"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Anosh Bilimoria", email = "anoshbilimoria@gmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "httpx>=0.27",
    "msal>=1.28",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
briefing-agent = "briefing_agent.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/briefing_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
